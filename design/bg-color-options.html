<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>背景配色方案对比</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1240px; background: #fff; }
  body { -webkit-font-smoothing: antialiased; color: #1c1c1e;
         font-family: -apple-system, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

  .wrap { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; padding: 18px; }
  .head { margin-bottom: 10px; padding-left: 2px; }
  .head b { font-size: 14px; display: block; }
  .head span { font-size: 11.5px; color: #6b7280; font-family: Consolas, monospace; line-height: 1.6; display: block; margin-top: 3px; }

  .stage { position: relative; height: 420px; border-radius: 16px; overflow: hidden;
           border: 1px solid rgba(0,0,0,.08); }

  .mesh { position: absolute; inset: 0; }
  .mesh i { position: absolute; display: block; border-radius: 50%; filter: blur(90px); }

  /* 卡片与应用一致 */
  .glass {
    position: absolute; left: 18px; right: 18px; bottom: 22px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.72);
    background: rgba(255,255,255,.38);
    -webkit-backdrop-filter: blur(6px) saturate(170%);
    backdrop-filter: blur(6px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.28),
                0 10px 40px -14px rgba(28,38,64,.24);
    padding: 16px 18px;
  }
  .glass h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; text-align: center; }
  .glass p { font-size: 13px; line-height: 1.85; }
  .title { position: absolute; left: 0; right: 0; top: 26px; text-align: center;
           font-size: 19px; font-weight: 700; }

  /* ===== A 现在：蓝 / 紫 / 青 / 暖砂，柔和 ===== */
  .A .stage { background: linear-gradient(145deg,#d3e0f0 0%,#e2e9f4 38%,#eae3da 72%,#dfe8f0 100%); }
  .A .mesh i:nth-child(1) { width: 620px; height: 620px; background: #6d9ad6; opacity: .92; top: -260px; left: -200px; }
  .A .mesh i:nth-child(2) { width: 560px; height: 560px; background: #a89bdc; opacity: .92; top: -230px; right: -170px; }
  .A .mesh i:nth-child(3) { width: 600px; height: 600px; background: #6fc0c4; opacity: .92; bottom: -300px; left: 90px; }
  .A .mesh i:nth-child(4) { width: 520px; height: 520px; background: #d8bc9c; opacity: .92; bottom: -250px; right: 10px; }

  /* ===== B 高彩度：色相不变、亮度不变，只提高饱和度 ===== */
  .B .stage { background: linear-gradient(145deg,#cfe0f2 0%,#e2e9f4 38%,#eae3da 72%,#dfe8f0 100%); }
  .B .mesh i:nth-child(1) { width: 620px; height: 620px; background: #3d84e0; opacity: .92; top: -260px; left: -200px; }
  .B .mesh i:nth-child(2) { width: 560px; height: 560px; background: #9181e6; opacity: .92; top: -230px; right: -170px; }
  .B .mesh i:nth-child(3) { width: 600px; height: 600px; background: #35c2c9; opacity: .92; bottom: -300px; left: 90px; }
  .B .mesh i:nth-child(4) { width: 520px; height: 520px; background: #dfae74; opacity: .92; bottom: -250px; right: 10px; }

  /* ===== C 黑白：对比最大。刻意把黑色光斑放在卡片正后方 —— 这是最坏情况 ===== */
  .C .stage { background: #d9d9d9; }
  .C .mesh i:nth-child(1) { width: 760px; height: 760px; background: #000; opacity: .9; top: 90px; left: 0px; }
  .C .mesh i:nth-child(2) { width: 600px; height: 600px; background: #fff; opacity: .95; top: -230px; right: -170px; }
  .C .mesh i:nth-child(3) { display: none; }
  .C .mesh i:nth-child(4) { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <section class="A">
    <div class="head"><b>A · 现在</b><span>色相拉开，明度柔和平缓</span></div>
    <div class="stage">
      <div class="mesh"><i></i><i></i><i></i><i></i></div>
      <div class="title">今天</div>
      <div class="glass">
        <h3>今天发生了什么？</h3>
        <p>上午参加了产线巡检，记录了贴片机的抛料率异常。下午跟师傅学习了 QCP 的更新流程。</p>
      </div>
    </div>
  </section>

  <section class="B">
    <div class="head"><b>B · 提高饱和度</b><span>色相与明度不变，只加彩度</span></div>
    <div class="stage">
      <div class="mesh"><i></i><i></i><i></i><i></i></div>
      <div class="title">今天</div>
      <div class="glass">
        <h3>今天发生了什么？</h3>
        <p>上午参加了产线巡检，记录了贴片机的抛料率异常。下午跟师傅学习了 QCP 的更新流程。</p>
      </div>
    </div>
  </section>

  <section class="C">
    <div class="head"><b>C · 黑色 + 白色</b><span>对比最大 —— 但请读一下卡片里的字</span></div>
    <div class="stage">
      <div class="mesh"><i></i><i></i><i></i><i></i></div>
      <div class="title">今天</div>
      <div class="glass">
        <h3>今天发生了什么？</h3>
        <p>上午参加了产线巡检，记录了贴片机的抛料率异常。下午跟师傅学习了 QCP 的更新流程。</p>
      </div>
    </div>
  </section>

</div>
</body>
</html>
